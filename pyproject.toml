[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-agent-harness"
version = "0.1.0"
description = "The chassis around the model for post-sales teams: router, tools, approvals. Model-agnostic, MCP-based, low token use."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2",
    "httpx>=0.27",
]

[project.scripts]
cs-harness = "harness.run:main"

[tool.setuptools.packages.find]
include = ["harness*", "connectors*"]
