# Belay release: the packaged installer (v1.14.0).
#
# On a version-tag push (v1.14.0, ...), build the packaged app on all
# three OSes and attach the files to the GitHub release for that tag.
# The Windows and macOS binaries can only be built on their own OS:
# this workflow is the only place they are built. The Linux binary is
# also built here, so every release ships all three from the same tag.
#
# No code signing in this build (unsigned first): signing needs the
# Apple Developer account and a Windows certificate, which are not
# available here. The README documents the Gatekeeper and SmartScreen
# warnings the user clicks through.
#
# Per-OS artifacts (one file each, plus the installers):
# - Windows: belay.exe (the bare executable) and Belay-Setup-<ver>.exe
#            (Inno Setup installer: Start Menu shortcut, optional PATH)
# - macOS:   Belay-macos.dmg (a disk image holding Belay.app plus an
#            Applications symlink, the standard drag-to-Applications
#            install). The .app is a thin launcher: double-clicking it
#            runs `belay launch`, which starts the dashboard and opens
#            it in the browser, with no terminal. First-run setup
#            happens in the dashboard Settings view.
# - Linux:   belay-linux (the bare executable, chmod +x),
#            belay_<ver>_amd64.deb (apt install, app menu entry) and
#            Belay-<ver>-x86_64.AppImage (double-click to run).
# The AUR PKGBUILD lives in packaging/aur/: AUR builds happen on the
# user's Arch machine, not in this workflow.
#
# The release notes lead with a plain-language "Get Belay" section
# (packaging/release-notes.md, rendered with the release version) so
# a non-technical reader can tell which file to download; the
# auto-generated changelog follows it (the action prepends `body` to
# the generated notes).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: belay.exe
          - os: macos-latest
            artifact: Belay-macos.dmg
          - os: ubuntu-latest
            artifact: belay-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt
      - name: Check the version matches the tag
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from harness import __version__; tag = '${{ github.ref_name }}'[1:]; assert __version__ == tag, 'version %s does not match tag %s' % (__version__, tag)"
      - name: Build the binary
        run: pyinstaller belay.spec
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: copy dist\belay.exe belay.exe
      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          iscc "/DMyAppVersion=$version" packaging\windows\belay.iss
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: Belay-Setup.exe
          path: Belay-Setup-*.exe
      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p Belay.app/Contents/MacOS Belay.app/Contents/Resources
          cp dist/belay Belay.app/Contents/MacOS/belay
          cat > Belay.app/Contents/MacOS/Belay <<'EOF'
          #!/bin/sh
          # Double-clicking Belay.app starts the dashboard and opens
          # it in the browser, with no terminal: `belay launch`
          # serves on localhost and opens the page. First-run setup
          # happens in the dashboard Settings view, not in a terminal.
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/belay" launch
          EOF
          chmod +x Belay.app/Contents/MacOS/Belay Belay.app/Contents/MacOS/belay
          mkdir -p Belay.app/Contents/Resources
          cp harness/assets/belay-icon.png Belay.app/Contents/Resources/belay-icon.png
          cat > Belay.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Belay</string>
            <key>CFBundleIdentifier</key>
            <string>net.jfournier.belay</string>
            <key>CFBundleName</key>
            <string>Belay</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
          </dict>
          </plist>
          EOF
          rm -rf dmg-staging
          mkdir -p dmg-staging
          ditto Belay.app dmg-staging/Belay.app
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname Belay -srcfolder dmg-staging -ov -format UDZO Belay-macos.dmg
      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp dist/belay belay-linux
          chmod +x belay-linux
      - name: Build .deb package
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash packaging/linux/build-deb.sh belay-linux "$VERSION"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: belay-deb
          path: belay_*_amd64.deb
      - name: Build AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL -o appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGETOOL="$PWD/appimagetool-x86_64.AppImage" bash packaging/linux/build-appimage.sh belay-linux "$VERSION"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: Belay-AppImage
          path: Belay-*-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Render release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/{version}/$VERSION/g" packaging/release-notes.md > release-notes.md
          if grep -q '{version}' release-notes.md; then
            echo "release notes still contain {version} after rendering" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/belay.exe
            artifacts/Belay-macos.dmg
            artifacts/belay-linux
            artifacts/Belay-Setup-*.exe
            artifacts/belay_*_amd64.deb
            artifacts/Belay-*-x86_64.AppImage
          body_path: release-notes.md
          generate_release_notes: true
